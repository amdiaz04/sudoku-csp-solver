services:
  # Spring Boot API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  # React frontend served by nginx
  frontend:
    build:
      context: ./sudoku-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:8080"
    environment:
      PORT: 8080
      API_URL: http://api:8080
    depends_on:
      - api
