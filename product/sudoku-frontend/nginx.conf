server {
    listen ${PORT};
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the API hostname at request time (not just at startup).
    resolver ${DNS_RESOLVER} valid=30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend (URL comes from the API_URL env var).
    location /api/ {
        set $backend "${API_URL}";
        proxy_pass $backend;
        # Cloud Run needs SNI and the API's own hostname in the Host header.
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;

        # Allow phone photo uploads (nginx default is 1 MB)
        client_max_body_size 10m;
        proxy_set_header X-Real-IP $remote_addr;

        # Cloud Run responses have large header bundles, so enlarge the buffers.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
