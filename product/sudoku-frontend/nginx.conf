server {
    listen ${PORT};
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend (URL comes from the API_URL env var).
    location /api/ {
        proxy_pass ${API_URL};
        # Cloud Run needs SNI and the API's own hostname in the Host header.
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
