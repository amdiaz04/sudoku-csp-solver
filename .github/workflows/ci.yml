name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product/sudokuproject
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: product/sudokuproject/pom.xml

      - name: Build
        run: mvn --batch-mode compile

      - name: Test
        run: mvn --batch-mode test

      - name: Coverage (JaCoCo)
        run: mvn --batch-mode verify

      - name: Checkstyle
        run: mvn --batch-mode checkstyle:check

      - name: SpotBugs
        run: mvn --batch-mode spotbugs:check

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: |
            product/sudokuproject/pom.xml
            product/sudoku-api/pom.xml

      - name: Install core library
        run: mvn --batch-mode -f product/sudokuproject/pom.xml install -DskipTests

      - name: API tests
        run: mvn --batch-mode -f product/sudoku-api/pom.xml test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product/sudoku-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product/sudoku-frontend/package-lock.json

      - run: npm ci

      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f product/docker-compose.yml build
